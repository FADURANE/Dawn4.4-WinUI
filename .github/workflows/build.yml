name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      PROJECT_PATH: Dawn44.WinUI\Dawn44.WinUI.csproj
      PUBLISH_DIR: Dawn44.WinUI\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish-unpackaged
      INSTALLER_SCRIPT: installer\Dawn44Control.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        shell: pwsh
        run: |
          msbuild $env:PROJECT_PATH `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsPackageType=None `
            /m `
            /noLogo

      - name: Publish unpackaged x64
        shell: pwsh
        run: |
          msbuild $env:PROJECT_PATH `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PublishProfile=unpackaged-x64 `
            /p:WindowsPackageType=None `
            /t:Publish `
            /m `
            /noLogo

      - name: Reorganize publish output
        shell: pwsh
        run: |
          $pub = "$env:PUBLISH_DIR"
          $bin = "$pub\bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # Native DLLs that must stay next to the exe
          $nativeKeep = @('Microsoft.WindowsAppRuntime.Bootstrap.dll', 'WebView2Loader.dll')
          Get-ChildItem "$pub\*.dll" | Where-Object { $_.Name -notin $nativeKeep } | ForEach-Object {
              Move-Item $_.FullName "$bin\$($_.Name)" -Force
          }

          # Patch runtimeconfig.json to add additionalProbingPaths
          $rcPath = "$pub\Dawn44.WinUI.runtimeconfig.json"
          $rc = Get-Content $rcPath -Raw | ConvertFrom-Json
          if (-not $rc.runtimeOptions.PSObject.Properties['additionalProbingPaths']) {
              $rc.runtimeOptions | Add-Member -MemberType NoteProperty `
                  -Name 'additionalProbingPaths' -Value @('./bin')
          } else {
              $rc.runtimeOptions.additionalProbingPaths = @('./bin')
          }
          $rc | ConvertTo-Json -Depth 10 | Set-Content $rcPath -Encoding UTF8

      - name: Archive for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath Dawn44Control-unpackaged-x64.zip `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Locate Windows App Runtime packages
        id: winapp_runtime
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windowsappsdk.runtime\2.2.0\tools\MSIX\win10-x64'
          if (!(Test-Path $packageRoot)) {
            throw "Windows App Runtime package directory not found: $packageRoot"
          }
          "dir=$packageRoot" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DWinAppRuntimeDir="${{ steps.winapp_runtime.outputs.dir }}" `
            $env:INSTALLER_SCRIPT

      - name: Upload unpackaged app
        uses: actions/upload-artifact@v4
        with:
          name: Dawn44Control-unpackaged-x64
          path: ${{ env.PUBLISH_DIR }}
          include-hidden-files: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Dawn44Control-installer-x64
          path: installer\Output\*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Dawn44Control-unpackaged-x64.zip
            installer/Output/*.exe
