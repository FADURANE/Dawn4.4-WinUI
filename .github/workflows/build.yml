name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      PROJECT_PATH: Dawn44.WinUI\Dawn44.WinUI.csproj
      TEST_PROJECT_PATH: Dawn44.Core.Tests\Dawn44.Core.Tests.csproj
      BACKGROUND_PROJECT_PATH: Dawn44.Background\Dawn44.Background.csproj
      BACKGROUND_PUBLISH_DIR: Dawn44.Background\bin\Release\net8.0-windows\win-x64\publish
      PUBLISH_DIR: Dawn44.WinUI\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish-unpackaged
      INSTALLER_SCRIPT: installer\Dawn44Control.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Runs before the app build so a protocol or settings regression fails fast. These tests are
      # pure: no HID device, no registry, no %LOCALAPPDATA% access.
      - name: Test Dawn44.Core
        shell: pwsh
        run: |
          dotnet test $env:TEST_PROJECT_PATH `
            --configuration Release `
            --nologo

      - name: Restore
        shell: pwsh
        run: |
          msbuild $env:PROJECT_PATH `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsPackageType=None `
            /m `
            /noLogo

      - name: Publish unpackaged x64
        shell: pwsh
        run: |
          msbuild $env:PROJECT_PATH `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PublishProfile=unpackaged-x64 `
            /p:WindowsPackageType=None `
            /t:Publish `
            /m `
            /noLogo

      # NativeAOT: the ILC step links with MSVC, which is why this cannot be produced on a machine
      # without Visual Studio and has to be built here. The result is self-contained, so the single
      # exe runs with no .NET 8 desktop runtime installed.
      - name: Publish background exe (NativeAOT x64)
        shell: pwsh
        run: |
          dotnet publish $env:BACKGROUND_PROJECT_PATH `
            --configuration Release `
            --runtime win-x64 `
            --nologo
          $exe = Get-Item "$env:BACKGROUND_PUBLISH_DIR\Dawn44.Background.exe"
          "Dawn44.Background.exe on disk: {0:N2} MB" -f ($exe.Length / 1MB)

      # Both exes have to end up in the same directory: each resolves the other by file name from its
      # own location (ModeExecutable.Resolve), which is what lets a mode switch and the logon entry
      # find the executable they need. Copying into the publish directory covers the installer and the
      # release zip at once, since both are built from it.
      - name: Stage background exe beside the app
        shell: pwsh
        run: |
          Copy-Item `
            -Path "$env:BACKGROUND_PUBLISH_DIR\Dawn44.Background.exe" `
            -Destination $env:PUBLISH_DIR `
            -Force

      - name: Archive for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath Dawn44Control-unpackaged-x64.zip `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Locate Windows App Runtime packages
        id: winapp_runtime
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windowsappsdk.runtime\2.2.0\tools\MSIX\win10-x64'
          if (!(Test-Path $packageRoot)) {
            throw "Windows App Runtime package directory not found: $packageRoot"
          }
          "dir=$packageRoot" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DWinAppRuntimeDir="${{ steps.winapp_runtime.outputs.dir }}" `
            $env:INSTALLER_SCRIPT

      - name: Upload unpackaged app
        uses: actions/upload-artifact@v4
        with:
          name: Dawn44Control-unpackaged-x64
          path: ${{ env.PUBLISH_DIR }}
          include-hidden-files: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Dawn44Control-installer-x64
          path: installer\Output\*.exe

      - name: Upload background exe
        uses: actions/upload-artifact@v4
        with:
          name: Dawn44Background-x64
          path: ${{ env.BACKGROUND_PUBLISH_DIR }}\Dawn44.Background.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Dawn44Control-unpackaged-x64.zip
            installer/Output/*.exe
